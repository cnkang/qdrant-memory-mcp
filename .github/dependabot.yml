version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
    groups:
      python-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns: ['*']
