name: Cross-harness integration

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      cold_setup:
        description: Prepare fresh managed Python, Runtime and real CPU model
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-lifecycle:
    name: Hermes to Pi automatic Owner handoff (deterministic models)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: 802b4c66551106253350d686650e25ffac57e4f9
          path: .scratch/owner-runtime
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: NousResearch/hermes-agent
          ref: 8f5693af418256b89da17ddda18a9242f113dcf6
          path: .scratch/hermes-host
          persist-credentials: false
      - name: Install source-preview Runtime and exact Pi family
        run: |
          python -m pip install './.scratch/owner-runtime[remote]' 'pytest>=8,<10' 'PyYAML>=6,<7' 'requests>=2,<3' 'ruamel.yaml>=0.18,<0.20'
          npm ci --prefix integrations/agent-hosts --ignore-scripts --no-audit --no-fund
      - name: Actual Pi session lifecycle with deterministic model provider
        run: node --test tests/test_pi_owner_extension.mjs tests/test_pi_owner_transport.mjs tests/test_pi_owner_host.mjs
      - name: Actual Hermes callbacks to a fresh Pi session over verified HTTPS MCP
        env:
          QDRANT_OWNER_RUNTIME_ROOT: ${{ github.workspace }}/.scratch/owner-runtime
          PYTHONPATH: ${{ github.workspace }}/.scratch/hermes-host
        run: python -m pytest tests/test_native_pi_handoff.py -q --junitxml=owner-lifecycle-results.xml -W error::pytest.PytestUnhandledThreadExceptionWarning
      - name: Require executed handoff acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E; s=E.parse('owner-lifecycle-results.xml').findall('.//testsuite');
          assert sum(int(x.get('tests',0)) for x in s)>=1;
          assert sum(int(x.get('skipped',0)) for x in s)==0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owner-lifecycle
          path: owner-lifecycle-results.xml
          if-no-files-found: error
  integration:
    name: MCP adapters (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/skills
          ref: d6062f07f35a741d5058712ab5e9966b39f87e00
          path: .scratch/canonical-skills
          persist-credentials: false
      - name: Install published Python MCP and test dependencies
        run: python -m pip install . 'pytest>=8,<10' 'requests>=2,<3' 'jsonschema>=4,<5'
      - name: Install exact official DSH client and Skill provider
        working-directory: integrations/dsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure pnpm for the official DSH plugin manager
        shell: bash
        run: pnpm --version || npm install --global pnpm@12.14.0
      - name: Artifact, cold handshake, host isolation and secret boundaries
        run: node --test tests/test_managed_bootstrap.mjs tests/test_managed_launcher.mjs
      - name: Require a complete and clean npm payload
        run: python scripts/pack_launcher.py --output-dir dist/launcher
      - name: WorkBuddy connector and shared bridge integration
        run: python -m pytest -q tests/test_workbuddy_mcp.py tests/test_workbuddy_package.py tests/test_managed_bridge.py tests/test_cross_harness.py tests/test_dsh_bundle.py tests/test_shared_preview_configs.py --junitxml=workbuddy-results.xml
      - name: Official DSH client probe, unload, CRUD, bundle install and fresh-process persistence
        env:
          DSH_TEST_MODULES: ${{ github.workspace }}/integrations/dsh/node_modules
          QDRANT_TEST_SKILL_ROOT: ${{ github.workspace }}/.scratch/canonical-skills
        run: python -m pytest -q tests/dsh_acceptance.py --junitxml=dsh-results.xml
      - name: Reject skipped integration acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=[s for p in ['workbuddy-results.xml','dsh-results.xml'] for s in E.parse(p).findall('.//testsuite')];
          assert sum(int(s.get('tests',0)) for s in suites)>=13;
          assert sum(int(s.get('skipped',0)) for s in suites)==0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cross-harness-${{ matrix.os }}
          path: '*-results.xml'
          if-no-files-found: error

  cold-setup:
    if: github.event_name != 'workflow_dispatch' || inputs.cold_setup
    name: Managed CPU setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Pack and install the actual launcher distribution
        shell: bash
        env:
          LAUNCHER_TEST_ROOT: ${{ runner.temp }}/launcher-test
        run: |
          mkdir -p "$LAUNCHER_TEST_ROOT"
          cd integrations/managed
          npm pack --ignore-scripts --pack-destination "$LAUNCHER_TEST_ROOT"
          npm install --prefix "$LAUNCHER_TEST_ROOT" --ignore-scripts --no-audit --no-fund "$LAUNCHER_TEST_ROOT"/*.tgz
      - name: Fresh shared program and isolated host profiles
        env:
          QDRANT_MEMORY_MANAGED_ROOT: ${{ runner.temp }}/qdrant-managed-acceptance
          QDRANT_TEST_LAUNCHER_ROOT: ${{ runner.temp }}/launcher-test/node_modules/@cnkang/qdrant-memory-launcher
        run: node tests/managed-cold-acceptance.mjs

  public-launcher:
    name: Public npm acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - name: Check whether the pinned launcher is already public
        id: pin
        run: python integrations/workbuddy/public_install.py
      - name: "Exact public npx commands: handshake, preparation, CRUD and persistence"
        if: steps.pin.outputs.launcher == 'true'
        env:
          QDRANT_MEMORY_MANAGED_ROOT: ${{ runner.temp }}/qdrant-public-acceptance
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
          QDRANT_PUBLIC_ACCEPTANCE_REPORT: ${{ runner.temp }}/public-launcher-report.json
        run: node tests/public-launcher-acceptance.mjs
      - name: Record an unpublished pin as NOT VERIFIED
        if: steps.pin.outputs.launcher != 'true'
        run: 'echo "Public npm acceptance: NOT VERIFIED (pinned launcher version is not yet public; rerun after publication)"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: public-launcher-${{ matrix.os }}
          path: ${{ runner.temp }}/public-launcher-report.json
          if-no-files-found: warn

  existing-hosts:
    name: OpenCode and Pi compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/skills
          ref: d6062f07f35a741d5058712ab5e9966b39f87e00
          path: .scratch/canonical-skills
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: ae11a0676724afb4af160b51d32da81b0828e089
          path: .scratch/runtime
          persist-credentials: false
      - name: Install standalone Runtime and existing-host test dependencies
        run: python -m pip install . './.scratch/runtime[mcp]' 'pytest>=8,<10' 'PyYAML>=6,<7' 'requests>=2,<3'
      - name: Install exact OpenCode and Pi CLIs
        working-directory: integrations/agent-hosts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/@opencode/cli/postinstall.mjs
          ./node_modules/.bin/opencode --version
      - name: Existing host registration, discovery and shared/private scope
        env:
          QDRANT_LOCAL_AGENTS: '1'
          QDRANT_STANDALONE_E2E: '1'
          QDRANT_STANDALONE_ROOT: ${{ github.workspace }}/.scratch/runtime
          PI_ACCEPTANCE_CLI: ${{ github.workspace }}/integrations/agent-hosts/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
        run: |
          export PATH="$GITHUB_WORKSPACE/integrations/agent-hosts/node_modules/.bin:$PATH"
          python -m pytest -q \
            .scratch/canonical-skills/tests/test_local_agent_mcp.py::test_installed_opencode_connects_scoped_mcp \
            .scratch/canonical-skills/tests/test_local_agent_mcp.py::test_installed_pi_discovers_scoped_mcp \
            .scratch/canonical-skills/tests/test_shared_memory_mcp.py --junitxml=existing-hosts-results.xml
      - name: Reject skipped existing-host acceptance
        run: python .scratch/canonical-skills/scripts/check_test_report.py existing-hosts-results.xml --minimum-tests 3
      - name: Install locked Pi SDK Skill acceptance
        run: npm ci --prefix .scratch/canonical-skills/tests/agent-hosts/pi --ignore-scripts --no-audit --no-fund
      - name: Pi Skill discovery, reference loading and actual tool loop
        run: |
          mkdir -p .scratch/canonical-skills/reports
          npm test --prefix .scratch/canonical-skills/tests/agent-hosts/pi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: existing-hosts
          path: |
            existing-hosts-results.xml
            .scratch/canonical-skills/reports/pi-host.xml
          if-no-files-found: error
