name: Distribution CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'pytest>=8,<10' 'jsonschema>=4,<5'
      - name: Build immutable Runtime preparation fixture
        run: python scripts/prepare_runtime.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/verify_metadata.py
      - name: Create fresh wheel environment and exercise protocol
        shell: bash
        run: |
          python -m venv .wheel-env
          if [ '${{ runner.os }}' = 'Windows' ]; then PY=.wheel-env/Scripts/python.exe; else PY=.wheel-env/bin/python; fi
          "$PY" -m pip install --find-links .runtime-dist dist/*.whl 'pytest>=8,<10'
          "$PY" -m pytest -q tests --junitxml=wheel-results.xml
      - name: Create fresh sdist environment and exercise protocol
        shell: bash
        run: |
          python -m venv .sdist-env
          if [ '${{ runner.os }}' = 'Windows' ]; then PY=.sdist-env/Scripts/python.exe; else PY=.sdist-env/bin/python; fi
          "$PY" -m pip install --find-links .runtime-dist dist/*.tar.gz 'pytest>=8,<10'
          "$PY" -m pytest -q tests --junitxml=sdist-results.xml
      - name: Reject skipped acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=[s for p in ['wheel-results.xml','sdist-results.xml'] for s in E.parse(p).findall('.//testsuite')];
          assert sum(int(s.get('tests',0)) for s in suites)>=12;
          assert sum(int(s.get('skipped',0)) for s in suites)==0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-${{ matrix.python }}
          path: '*-results.xml'
          if-no-files-found: error
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.0'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: modelcontextprotocol/registry
          ref: 11b7b0e274d518b6f449c5ee3518a6151d9848b9
          path: .publisher/source
          persist-credentials: false
      - name: Build official publisher with working validate command
        working-directory: .publisher/source
        run: go build -o ../mcp-publisher ./cmd/publisher
      - run: .publisher/mcp-publisher validate
