name: Distribution CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  distribution:
    name: Distribution (${{ matrix.os }}, Python ${{ matrix.python }}, SDK ${{ matrix.mcp.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.11', '3.14']
        mcp:
          - name: '1.x'
            requirement: 'mcp>=1.30,<2'
          - name: '2.x'
            requirement: 'mcp>=2,<3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'pytest>=8,<10' 'jsonschema>=4,<5'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - name: Use public Runtime or immutable preparation fixture
        run: python scripts/prepare_runtime.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/verify_metadata.py
      - name: Create fresh wheel environment and exercise protocol
        shell: bash
        run: |
          python -m venv .wheel-env
          if [ '${{ runner.os }}' = 'Windows' ]; then PY=.wheel-env/Scripts/python.exe; else PY=.wheel-env/bin/python; fi
          "$PY" -m pip install --find-links .runtime-dist dist/*.whl 'pytest>=8,<10' 'requests>=2,<3' '${{ matrix.mcp.requirement }}'
          "$PY" -m pytest -q tests --ignore=tests/test_native_pi_handoff.py --junitxml=wheel-results.xml
      - name: Create fresh sdist environment and exercise protocol
        shell: bash
        run: |
          python -m venv .sdist-env
          if [ '${{ runner.os }}' = 'Windows' ]; then PY=.sdist-env/Scripts/python.exe; else PY=.sdist-env/bin/python; fi
          "$PY" -m pip install --find-links .runtime-dist dist/*.tar.gz 'pytest>=8,<10' 'requests>=2,<3' '${{ matrix.mcp.requirement }}'
          "$PY" -m pytest -q tests --ignore=tests/test_native_pi_handoff.py --junitxml=sdist-results.xml
      - name: Reject skipped acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=[s for p in ['wheel-results.xml','sdist-results.xml'] for s in E.parse(p).findall('.//testsuite')];
          assert sum(int(s.get('tests',0)) for s in suites)>=24;
          assert sum(int(s.get('skipped',0)) for s in suites)==0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acceptance-${{ matrix.os }}-${{ matrix.python }}-mcp-${{ matrix.mcp.name }}
          path: '*-results.xml'
          if-no-files-found: error
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: modelcontextprotocol/registry
          ref: 11b7b0e274d518b6f449c5ee3518a6151d9848b9
          path: .publisher/source
          persist-credentials: false
      - name: Build official publisher with working validate command
        working-directory: .publisher/source
        run: go build -o ../mcp-publisher ./cmd/publisher
      - run: .publisher/mcp-publisher validate
