name: Codex plugin cloud acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-plugin-cloud
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      client_sha: ${{ steps.checked.outputs.client_sha }}
    steps:
      - name: Require reviewed upstream main
        id: checked
        shell: python
        run: |
          import os
          from pathlib import Path
          expected = ("workflow_dispatch", "refs/heads/main", "cnkang/qdrant-memory-mcp")
          actual = tuple(os.environ[key] for key in ("GITHUB_EVENT_NAME", "GITHUB_REF", "GITHUB_REPOSITORY"))
          if actual != expected:
              raise SystemExit("Cloud acceptance requires reviewed upstream main")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("client_sha=" + os.environ["GITHUB_SHA"] + "\n")
  cloud:
    name: Codex harness and Ollama Cloud (synthetic memories only)
    needs: preflight
    runs-on: ubuntu-24.04
    environment: soak-cloud
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.client_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install the declared Runtime and pinned Codex
        run: |
          npm install --global --ignore-scripts @openai/codex@0.165.0
          python -m venv "$RUNNER_TEMP/codex-runtime"
          "$RUNNER_TEMP/codex-runtime/bin/python" -m pip install -r plugins/qdrant-memory/requirements.txt
          "$RUNNER_TEMP/codex-runtime/bin/python" -c 'import importlib.metadata as m,json,pathlib; expected=json.loads(pathlib.Path("plugins/qdrant-memory/release.json").read_text())["runtime_commit"]; source=json.loads(m.distribution("hermes-plugin-qdrant-memory").read_text("direct_url.json")); assert source["vcs_info"]["commit_id"] == expected; print(json.dumps({"runtime_commit":expected}))'
      - name: Run actual Codex with the protected Ollama model
        env:
          SOAK_LLM_BASE_URL: ${{ vars.SOAK_LLM_BASE_URL }}
          SOAK_LLM_MODEL: ${{ vars.SOAK_LLM_MODEL }}
          SOAK_LLM_API_KEY: ${{ secrets.SOAK_LLM_API_KEY }}
        run: |
          python scripts/codex_account_acceptance.py --mode cloud \
            --runtime "$RUNNER_TEMP/codex-runtime/bin/qdrant-memory" \
            --workdir "$RUNNER_TEMP/codex-synthetic-window" \
            > "$RUNNER_TEMP/codex-plugin-result.json"
      - name: Summarize explicit outcome
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "codex-plugin-result.json"
          try:
              result = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(result, dict) or result.get("status") not in ("PASS", "FAIL", "NOT VERIFIED"):
                  raise ValueError("Invalid acceptance result")
          except (OSError, UnicodeError, ValueError):
              result = {"status": "NOT VERIFIED", "reason": "acceptance result missing or invalid"}
              replacement = path.with_name(path.name + ".fallback")
              replacement.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
              replacement.replace(path)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(json.dumps(result, indent=2) + "\n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codex-ollama-synthetic-result
          path: ${{ runner.temp }}/codex-plugin-result.json
          if-no-files-found: error
