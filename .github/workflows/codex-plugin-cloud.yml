name: Codex plugin cloud acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-plugin-cloud
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      client_sha: ${{ steps.checked.outputs.client_sha }}
    steps:
      - name: Require reviewed upstream main
        id: checked
        shell: python
        run: |
          import os
          from pathlib import Path
          expected = ("workflow_dispatch", "refs/heads/main", "cnkang/qdrant-memory-mcp")
          actual = tuple(os.environ[key] for key in ("GITHUB_EVENT_NAME", "GITHUB_REF", "GITHUB_REPOSITORY"))
          if actual != expected:
              raise SystemExit("Cloud acceptance requires reviewed upstream main")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("client_sha=" + os.environ["GITHUB_SHA"] + "\n")
  cloud:
    name: Codex harness and Ollama Cloud (synthetic memories only)
    needs: preflight
    runs-on: ubuntu-24.04
    environment: soak-cloud
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.preflight.outputs.client_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Read pinned Skill source commit
        id: skill
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          release = json.loads(Path("plugins/qdrant-memory/release.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("commit=" + release["skill_commit"] + "\n")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: ${{ steps.skill.outputs.commit }}
          path: .skill-source
          persist-credentials: false
      - name: Build the exact Codex plugin ZIP
        id: package
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          release = json.loads(Path("plugins/qdrant-memory/release.json").read_text(encoding="utf-8"))
          archive = Path.cwd() / "dist" / f"qdrant-memory-codex-{release['plugin_version']}.zip"
          result = subprocess.run(
              [sys.executable, "scripts/build_codex_plugin.py", "--skill-repo", ".skill-source", "--output", str(archive)],
              check=True,
              capture_output=True,
              text=True,
          )
          build = json.loads(result.stdout)
          if Path(build["path"]).resolve() != archive.resolve() or build["source_dirty"]:
              raise SystemExit("Codex plugin ZIP does not match clean reviewed source")
          Path(os.environ["RUNNER_TEMP"], "codex-plugin-build.json").write_text(
              json.dumps(build, indent=2) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("path=" + str(archive) + "\n")
      - name: Install the declared Runtime and pinned Codex
        shell: bash
        env:
          CODEX_CLI_VERSION: '0.167.2'
        run: |
          lock_dir=".github/codex-cli-locks/${CODEX_CLI_VERSION}"
          install_dir="$RUNNER_TEMP/codex-cli"
          mkdir -p "$install_dir"
          cp "$lock_dir/package.json" "$lock_dir/package-lock.json" "$install_dir/"
          (cd "$install_dir" && npm ci --ignore-scripts --no-audit --no-fund)
          node -e 'const p=require(process.argv[1]+"/node_modules/@openai/codex/package.json"); if(p.version!==process.argv[2]) throw new Error("expected "+process.argv[2]+", got "+p.version)' "$install_dir" "$CODEX_CLI_VERSION"
          echo "$install_dir/node_modules/.bin" >> "$GITHUB_PATH"
          python -m venv "$RUNNER_TEMP/codex-runtime"
          "$RUNNER_TEMP/codex-runtime/bin/python" -m pip install --index-url https://pypi.org/simple -r plugins/qdrant-memory/requirements.txt
          "$RUNNER_TEMP/codex-runtime/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          from pathlib import Path

          release = json.loads(Path("plugins/qdrant-memory/release.json").read_text(encoding="utf-8"))
          expected = {
              "qdrant-memory-mcp": release["mcp_distribution_version"],
              "hermes-plugin-qdrant-memory": release["runtime_version"],
          }
          installed = {}
          for name, version in expected.items():
              distribution = metadata.distribution(name)
              if distribution.version != version:
                  raise SystemExit(f"Expected {name} {version}, installed {distribution.version}")
              if distribution.read_text("direct_url.json") is not None:
                  raise SystemExit(f"Expected {name} from public PyPI, found a direct URL install")
              installed[name] = distribution.version
          print(json.dumps({
              "registry": "https://pypi.org/simple",
              "distributions": installed,
              "runtime_source_commit_provenance": release["runtime_commit"],
          }))
          PY
      - name: Test repository-backed marketplace with protected Ollama
        id: source_acceptance
        continue-on-error: true
        env:
          SOAK_LLM_BASE_URL: ${{ vars.SOAK_LLM_BASE_URL }}
          SOAK_LLM_MODEL: ${{ vars.SOAK_LLM_MODEL }}
          SOAK_LLM_API_KEY: ${{ secrets.SOAK_LLM_API_KEY }}
        run: |
          python scripts/codex_account_acceptance.py --mode cloud \
            --runtime "$RUNNER_TEMP/codex-runtime/bin/qdrant-memory" \
            --workdir "$RUNNER_TEMP/codex-source-synthetic-window" \
            > "$RUNNER_TEMP/codex-plugin-source-result.json"
      - name: Test exact rebuilt plugin ZIP with protected Ollama
        id: zip_acceptance
        continue-on-error: true
        env:
          SOAK_LLM_BASE_URL: ${{ vars.SOAK_LLM_BASE_URL }}
          SOAK_LLM_MODEL: ${{ vars.SOAK_LLM_MODEL }}
          SOAK_LLM_API_KEY: ${{ secrets.SOAK_LLM_API_KEY }}
          CODEX_PLUGIN_ZIP: ${{ steps.package.outputs.path }}
        run: |
          python scripts/codex_account_acceptance.py --mode cloud \
            --runtime "$RUNNER_TEMP/codex-runtime/bin/qdrant-memory" \
            --plugin-zip "$CODEX_PLUGIN_ZIP" \
            --workdir "$RUNNER_TEMP/codex-zip-synthetic-window" \
            > "$RUNNER_TEMP/codex-plugin-zip-result.json"
      - name: Summarize explicit outcome
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          path = temp / "codex-plugin-result.json"

          def read_result(name):
              try:
                  value = json.loads((temp / name).read_text(encoding="utf-8"))
                  if isinstance(value, dict) and value.get("status") in ("PASS", "FAIL", "NOT VERIFIED"):
                      return value
              except (OSError, UnicodeError, ValueError):
                  pass
              return {"status": "NOT VERIFIED", "reason": "acceptance result missing or invalid"}

          source = read_result("codex-plugin-source-result.json")
          archive = read_result("codex-plugin-zip-result.json")
          try:
              build = json.loads((temp / "codex-plugin-build.json").read_text(encoding="utf-8"))
              build_sha256 = build.get("sha256") if isinstance(build, dict) else None
          except (OSError, UnicodeError, ValueError):
              build_sha256 = None
          archive_sha256 = archive.get("plugin_archive_sha256")
          archive_matches_build = (
              isinstance(build_sha256, str)
              and len(build_sha256) == 64
              and archive_sha256 == build_sha256
          )
          source_passed = (
              source.get("status") == "PASS"
              and source.get("installation_source") == "repository"
          )
          archive_passed = (
              archive.get("status") == "PASS"
              and archive.get("installation_source") == "zip"
              and archive_matches_build
          )
          missing_evidence = (
              source.get("status") == "NOT VERIFIED"
              or archive.get("status") == "NOT VERIFIED"
              or not isinstance(build_sha256, str)
          )
          result = {
              "status": "PASS" if source_passed and archive_passed else "NOT VERIFIED" if missing_evidence else "FAIL",
              "repository_source_commit": os.environ["GITHUB_SHA"],
              "repository_marketplace_acceptance": source,
              "zip_acceptance": archive,
              "plugin_archive_sha256": archive_sha256,
              "build_metadata_sha256": build_sha256,
              "archive_matches_build_metadata": archive_matches_build,
          }
          path.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(json.dumps(result, indent=2) + "\n")
          if result["status"] != "PASS":
              raise SystemExit("Both repository marketplace and exact ZIP acceptance must pass")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: codex-ollama-synthetic-result
          path: ${{ runner.temp }}/codex-plugin-result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.package.outputs.path != ''
        with:
          name: codex-plugin-verified-source-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ runner.temp }}/codex-plugin-build.json
          if-no-files-found: error
