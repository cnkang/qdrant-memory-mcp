name: Prepare WorkBuddy draft release assets
on:
  push:
    tags: ['v*', 'workbuddy-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbuddy-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/workbuddy-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: 607b1335f7babc9a7a2f909d12d8214124d1032c
          path: .workbuddy-skill
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workbuddy-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
      - name: Require the pinned public launcher before preparing release assets
        run: python integrations/workbuddy/public_install.py --require-launcher
      - name: Verify source and build deterministic release connector
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python integrations/workbuddy/release.py --release-tag "$RELEASE_TAG" --check-source
          python integrations/workbuddy/build.py --release-tag "$RELEASE_TAG" --check
          python integrations/workbuddy/build.py --release-tag "$RELEASE_TAG"
      - name: Package and candidate protocol gates before protected PyPI publication
        run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_workflow_inputs.py tests/test_workbuddy_release.py tests/test_workbuddy_public_install.py tests/test_workbuddy_mcp.py tests/test_dsh_bundle.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workbuddy-release-assets
          path: dist/workbuddy/*
          if-no-files-found: error
  attach:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: "python -m pip install --only-binary=:all: 'requests==2.34.2'"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: workbuddy-release-assets
          path: dist/workbuddy
      - name: Validate inputs and attach only to Draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python integrations/workbuddy/release.py --release-tag "$RELEASE_TAG" --asset-dir dist/workbuddy
