name: Prepare WorkBuddy draft release assets
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbuddy-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/skills
          ref: c88eadceac2a7b33e5047d65d966d2e8c83c5f24
          path: .workbuddy-skill
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install . 'pytest>=8,<10' 'requests>=2,<3' 'PyYAML==6.0.3' 'uv==0.9.26'
      - name: Verify source and build deterministic release connector
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python integrations/workbuddy/release.py --release-tag "$RELEASE_TAG" --check-source
          python integrations/workbuddy/build.py --release-tag "$RELEASE_TAG" --check
          python integrations/workbuddy/build.py --release-tag "$RELEASE_TAG"
      - name: Package and candidate protocol gates before protected PyPI publication
        run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_release.py tests/test_workbuddy_public_install.py tests/test_workbuddy_mcp.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workbuddy-release-assets
          path: dist/workbuddy/*
          if-no-files-found: error
  attach:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2,<3'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: workbuddy-release-assets
          path: dist/workbuddy
      - name: Validate inputs and attach only to Draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python integrations/workbuddy/release.py --release-tag "$RELEASE_TAG" --asset-dir dist/workbuddy
