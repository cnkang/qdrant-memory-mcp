name: DSH cross-client acceptance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime source release used for this compatibility run
        required: false
        type: choice
        options:
          - '0.6.1'
          - '0.6.2'
        default: '0.6.2'
      node_version:
        description: Node.js version for the DSH host compatibility run
        required: false
        type: string
        default: '24.9.0'
      python_version:
        description: Python version for the source-built Owner runtime
        required: false
        type: choice
        options:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        default: '3.11'
      qdrant_client_version:
        description: Exact qdrant-client version for this compatibility run
        required: false
        type: string
        default: '1.20.0'
permissions:
  contents: read
concurrency:
  # Manual dispatches get their own group, so rerunning acceptance on `main`
  # cannot cancel the push run that the tag release gate requires.
  group: dsh-cross-client-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || '' }}
  cancel-in-progress: true
jobs:
  owner:
    # This fixed lane is the only DSH cross-client release-gate evidence.
    name: Real DSH AgentLoop and MCP over HTTPS with Docker Qdrant
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONWARNINGS: 'error:Qdrant client version:UserWarning'
      QDRANT_OWNER_RUNTIME_ROOT: ${{ github.workspace }}/.scratch/dsh-runtime
      QDRANT_DSH_EVIDENCE: ${{ github.workspace }}/dsh-cross-client.json
      DSH_RUNTIME_VERSION: '0.6.2'
      QDRANT_CLIENT_VERSION: '1.20.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          ref: 913fa705922b5bfeb29d52f102cfc6385a4d0436
          path: .scratch/dsh-runtime
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.9.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: '11.28.5'
          package_json_file: integrations/dsh/native/package.json
          run_install: false
      - name: Install exact DSH and build the source-snapshot Runtime wheel
        shell: bash
        run: |
          if [[ ! "$QDRANT_CLIENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'qdrant_client_version must be an exact X.Y.Z version' >&2
            exit 1
          fi
          npm ci --prefix .github/ci-deps/dsh-native --ignore-scripts --no-audit --no-fund
          npm ci --prefix integrations/dsh/native --ignore-scripts --no-audit --no-fund
          npm ci --prefix integrations/agent-hosts --ignore-scripts --no-audit --no-fund
          python -m pip install --only-binary=:all: 'build==1.4.0' 'pytest==9.2.0'
          python -m build .scratch/dsh-runtime --outdir "$RUNNER_TEMP/runtime-dist"
          python -m pip install --only-binary=:all: "$RUNNER_TEMP/runtime-dist/hermes_plugin_qdrant_memory-${DSH_RUNTIME_VERSION}-py3-none-any.whl[remote]" "qdrant-client==${QDRANT_CLIENT_VERSION}"
      - name: Start isolated fixed-version Qdrant
        run: docker compose -p dsh-ci -f tests/cross_client_e2e/docker-compose.yml up -d
      - name: Real AgentLoop capture, MCP recall and principal isolation
        run: |
          QDRANT_E2E_URL="http://$(docker compose -p dsh-ci -f tests/cross_client_e2e/docker-compose.yml port qdrant 6333)"
          export QDRANT_E2E_URL
          python -m pytest -q -s tests/cross_client_e2e/acceptance.py --junitxml=dsh-cross-client.xml -W error::pytest.PytestUnhandledThreadExceptionWarning
      - name: Require executed acceptance
        run: python -c "import xml.etree.ElementTree as E; s=E.parse('dsh-cross-client.xml').findall('.//testsuite'); assert sum(int(x.get('tests',0)) for x in s)>=1; assert all(int(x.get('skipped',0))==0 for x in s)"
      - name: Remove only disposable test resources
        if: always()
        run: docker compose -p dsh-ci -f tests/cross_client_e2e/docker-compose.yml down -v --remove-orphans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dsh-cross-client
          path: |
            dsh-cross-client.xml
            dsh-cross-client.json
          if-no-files-found: error

  compatibility:
    # Manual variants are an optional probe and never substitute for `owner`.
    name: Manual DSH compatibility probe (not release evidence)
    needs: owner
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.runtime_version != '0.6.2' ||
       inputs.node_version != '24.9.0' ||
       inputs.python_version != '3.11' ||
       inputs.qdrant_client_version != '1.20.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONWARNINGS: 'error:Qdrant client version:UserWarning'
      QDRANT_OWNER_RUNTIME_ROOT: ${{ github.workspace }}/.scratch/dsh-runtime
      QDRANT_DSH_EVIDENCE: ${{ github.workspace }}/dsh-cross-client-compatibility.json
      DSH_RUNTIME_VERSION: ${{ inputs.runtime_version }}
      QDRANT_CLIENT_VERSION: ${{ inputs.qdrant_client_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/hermes-plugin-qdrant-memory
          # Manual selections can choose only these immutable release sources.
          ref: ${{ inputs.runtime_version == '0.6.1' && '2696122405e3324a1e227c131e0f9b2a320dd23c' || '913fa705922b5bfeb29d52f102cfc6385a4d0436' }}
          path: .scratch/dsh-runtime
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node_version }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ inputs.python_version }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: '11.28.5'
          package_json_file: integrations/dsh/native/package.json
          run_install: false
      - name: Install exact DSH and build the selected Runtime compatibility wheel
        shell: bash
        run: |
          if [[ ! "$QDRANT_CLIENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'qdrant_client_version must be an exact X.Y.Z version' >&2
            exit 1
          fi
          npm ci --prefix .github/ci-deps/dsh-native --ignore-scripts --no-audit --no-fund
          npm ci --prefix integrations/dsh/native --ignore-scripts --no-audit --no-fund
          npm ci --prefix integrations/agent-hosts --ignore-scripts --no-audit --no-fund
          python -m pip install --only-binary=:all: 'build==1.4.0' 'pytest==9.2.0'
          python -m build .scratch/dsh-runtime --outdir "$RUNNER_TEMP/runtime-dist"
          python -m pip install --only-binary=:all: "$RUNNER_TEMP/runtime-dist/hermes_plugin_qdrant_memory-${DSH_RUNTIME_VERSION}-py3-none-any.whl[remote]" "qdrant-client==${QDRANT_CLIENT_VERSION}"
      - name: Start isolated compatibility Qdrant
        run: docker compose -p dsh-ci-compatibility -f tests/cross_client_e2e/docker-compose.yml up -d
      - name: Run the manual DSH compatibility probe
        run: |
          QDRANT_E2E_URL="http://$(docker compose -p dsh-ci-compatibility -f tests/cross_client_e2e/docker-compose.yml port qdrant 6333)"
          export QDRANT_E2E_URL
          python -m pytest -q -s tests/cross_client_e2e/acceptance.py --junitxml=dsh-cross-client-compatibility.xml -W error::pytest.PytestUnhandledThreadExceptionWarning
      - name: Require executed compatibility probe
        run: python -c "import xml.etree.ElementTree as E; s=E.parse('dsh-cross-client-compatibility.xml').findall('.//testsuite'); assert sum(int(x.get('tests',0)) for x in s)>=1; assert all(int(x.get('skipped',0))==0 for x in s)"
      - name: Remove only disposable compatibility resources
        if: always()
        run: docker compose -p dsh-ci-compatibility -f tests/cross_client_e2e/docker-compose.yml down -v --remove-orphans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dsh-cross-client-compatibility
          path: |
            dsh-cross-client-compatibility.xml
            dsh-cross-client-compatibility.json
          if-no-files-found: error
