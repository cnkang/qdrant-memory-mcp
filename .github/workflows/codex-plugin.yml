name: Codex plugin
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      codex_cli_version:
        description: Select a hash-locked @openai/codex version for the credential-free CLI probe
        required: false
        default: '0.167.2'
        type: choice
        options:
          - '0.167.2'
          - '0.165.0'
permissions:
  contents: read
concurrency:
  group: codex-plugin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Portable package and real CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install hash-locked Codex CLI version
        shell: bash
        env:
          CODEX_CLI_VERSION: ${{ github.event.inputs.codex_cli_version || '0.167.2' }}
        run: |
          case "$CODEX_CLI_VERSION" in
            0.167.2|0.165.0) ;;
            *) echo "::error::codex_cli_version must select a checked-in dependency lock"; exit 1 ;;
          esac
          lock_dir=".github/codex-cli-locks/${CODEX_CLI_VERSION}"
          install_dir="$RUNNER_TEMP/codex-cli"
          mkdir -p "$install_dir"
          cp "$lock_dir/package.json" "$lock_dir/package-lock.json" "$install_dir/"
          (cd "$install_dir" && npm ci --ignore-scripts --no-audit --no-fund)
          node -e 'const p=require(process.argv[1]+"/node_modules/@openai/codex/package.json"); if(p.version!==process.argv[2]) throw new Error("expected "+process.argv[2]+", got "+p.version)' "$install_dir" "$CODEX_CLI_VERSION"
          echo "$install_dir/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Report package test environment
        run: |
          python -c "import platform,sys; print('os='+platform.system()); print('arch='+platform.machine()); print('python='+sys.version); print('implementation='+platform.python_implementation()); print('sys.executable='+sys.executable)"
          node -e "console.log('node='+process.version); console.log('node_platform='+process.platform); console.log('node_arch='+process.arch)"
          codex --version
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt
          python -m pip install --only-binary=:all: --no-deps --no-build-isolation .
      - run: python scripts/build_codex_plugin.py --validate
      - name: Install the published MCP pin used by the current portable plugin
        run: "python -m pip install --only-binary=:all: --no-deps qdrant-memory-mcp==0.3.1"
      - name: Test the portable plugin against its current published pins
        run: python -m pytest -q "${{ github.workspace }}/tests/test_codex_plugin.py"
        working-directory: ${{ runner.temp }}
      - name: Install, check setup file, disable and uninstall without credentials
        run: python scripts/codex_install_smoke.py --home "${{ runner.temp }}/codex-plugin-smoke"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: 8f6e5280559f7f1d5e04781c6910b8c33b5f2dae
          path: .skill-source
          persist-credentials: false
      - name: Build immutable upstream skill snapshot
        run: python scripts/build_codex_plugin.py --skill-repo .skill-source
      - name: Verify candidate archive uses the exact source commit
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "import json, os, zipfile; archive=zipfile.ZipFile('dist/qdrant-memory-codex-0.1.3.zip'); path='qdrant-memory/release.json'; actual=json.loads(archive.read(path))['plugin_source_commit']; expected=os.environ['EXPECTED_SOURCE_COMMIT']; print(f'expected_source_commit={expected} actual_source_commit={actual}'); assert actual == expected"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-plugin-${{ matrix.os }}
          path: dist/qdrant-memory-codex-0.1.3.zip
          if-no-files-found: error

  merged-package:
    name: Validate merged revision with pinned skill snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt
          python -m pip install --only-binary=:all: --no-deps --no-build-isolation .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: 8f6e5280559f7f1d5e04781c6910b8c33b5f2dae
          path: .skill-source
          persist-credentials: false
      - run: python scripts/build_codex_plugin.py --validate
      - name: Build the pinned-skill-snapshot package from the merged revision
        run: python scripts/build_codex_plugin.py --skill-repo .skill-source
      - name: Install the published MCP pin used by the current portable plugin
        run: "python -m pip install --only-binary=:all: --no-deps qdrant-memory-mcp==0.3.1"
      - name: Test the merged plugin against its current published pins
        run: python -m pytest -q "${{ github.workspace }}/tests/test_codex_plugin.py"
        working-directory: ${{ runner.temp }}

  archive-parity:
    name: Compare cross-platform archive hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: portable
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codex-plugin-*
      - name: Fail when the three runner archives differ
        run: |
          python - <<'EOF'
          import hashlib, pathlib

          archives = sorted(pathlib.Path(".").glob("codex-plugin-*/**/qdrant-memory-codex-*.zip"))
          assert len(archives) == 3, (
              f"expected three runner archives, found {len(archives)}: "
              + ", ".join(str(path) for path in archives)
          )
          hashes = {
              archive.parts[0]: hashlib.sha256(archive.read_bytes()).hexdigest()
              for archive in archives
          }
          unique = set(hashes.values())
          assert len(unique) == 1, f"archive hashes differ across runners: {hashes}"
          print("matching_sha256=" + unique.pop())
          EOF

  lifecycle-e2e:
    name: Credential-free real CLI end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Windows is excluded: the lane's interruption probe integrates POSIX
        # signals; a native Windows interruption lane remains NOT VERIFIED.
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install hash-locked Codex CLI version
        shell: bash
        env:
          CODEX_CLI_VERSION: ${{ github.event.inputs.codex_cli_version || '0.167.2' }}
        run: |
          case "$CODEX_CLI_VERSION" in
            0.167.2|0.165.0) ;;
            *) echo "::error::codex_cli_version must select a checked-in dependency lock"; exit 1 ;;
          esac
          lock_dir=".github/codex-cli-locks/${CODEX_CLI_VERSION}"
          install_dir="$RUNNER_TEMP/codex-cli"
          mkdir -p "$install_dir"
          cp "$lock_dir/package.json" "$lock_dir/package-lock.json" "$install_dir/"
          (cd "$install_dir" && npm ci --ignore-scripts --no-audit --no-fund)
          node -e 'const p=require(process.argv[1]+"/node_modules/@openai/codex/package.json"); if(p.version!==process.argv[2]) throw new Error("expected "+process.argv[2]+", got "+p.version)' "$install_dir" "$CODEX_CLI_VERSION"
          echo "$install_dir/node_modules/.bin" >> "$GITHUB_PATH"
      - run: "python -m pip install --only-binary=:all: uv==0.13.6"
      - run: "python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt"
      - run: "python -m pip install --only-binary=:all: --no-deps --no-build-isolation ."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: 8f6e5280559f7f1d5e04781c6910b8c33b5f2dae
          path: .skill-source
          persist-credentials: false
      - name: Run the credential-free real CLI end-to-end
        id: e2e
        run: |
          python scripts/codex_plugin_e2e.py --work-dir "${{ runner.temp }}/codex-e2e" --skill-repo .skill-source > "${{ runner.temp }}/codex-e2e-report.json"
          cat "${{ runner.temp }}/codex-e2e-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.e2e.outcome != 'skipped'
        with:
          name: codex-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/codex-e2e-report.json
          if-no-files-found: warn
