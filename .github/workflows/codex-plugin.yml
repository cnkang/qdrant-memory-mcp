name: Codex plugin
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-plugin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: Portable package and real CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: npm install --global --ignore-scripts @openai/codex@0.165.0
      - name: Report package test environment
        run: |
          python -c "import platform,sys; print('os='+platform.system()); print('arch='+platform.machine()); print('python='+sys.version); print('implementation='+platform.python_implementation()); print('sys.executable='+sys.executable)"
          node -e "console.log('node='+process.version); console.log('node_platform='+process.platform); console.log('node_arch='+process.arch)"
          codex --version
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
      - run: python scripts/build_codex_plugin.py --validate
      - run: python -m pytest -q tests/test_codex_plugin.py
      - name: Install, check setup file, disable and uninstall without credentials
        run: python scripts/codex_install_smoke.py --home "${{ runner.temp }}/codex-plugin-smoke"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: fc8dea078f04d4ec2c90064676875f556ae6457e
          path: .skill-source
          persist-credentials: false
      - name: Build immutable upstream skill snapshot
        run: python scripts/build_codex_plugin.py --skill-repo .skill-source
      - name: Verify candidate archive uses the exact source commit
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -c "import json, os, zipfile; archive=zipfile.ZipFile('dist/qdrant-memory-codex-0.1.3.zip'); path='qdrant-memory/release.json'; actual=json.loads(archive.read(path))['plugin_source_commit']; expected=os.environ['EXPECTED_SOURCE_COMMIT']; print(f'expected_source_commit={expected} actual_source_commit={actual}'); assert actual == expected"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-plugin-${{ matrix.os }}
          path: dist/qdrant-memory-codex-0.1.3.zip
          if-no-files-found: error

  merged-package:
    name: Validate merged revision with pinned skill snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: fc8dea078f04d4ec2c90064676875f556ae6457e
          path: .skill-source
          persist-credentials: false
      - run: python scripts/build_codex_plugin.py --validate
      - name: Build the pinned-skill-snapshot package from the merged revision
        run: python scripts/build_codex_plugin.py --skill-repo .skill-source
      - run: python -m pytest -q tests/test_codex_plugin.py

  archive-parity:
    name: Compare cross-platform archive hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: portable
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: codex-plugin-*
      - name: Fail when the three runner archives differ
        run: |
          python - <<'EOF'
          import hashlib, pathlib

          archives = sorted(pathlib.Path(".").glob("codex-plugin-*/**/qdrant-memory-codex-*.zip"))
          assert len(archives) == 3, (
              f"expected three runner archives, found {len(archives)}: "
              + ", ".join(str(path) for path in archives)
          )
          hashes = {
              archive.parts[0]: hashlib.sha256(archive.read_bytes()).hexdigest()
              for archive in archives
          }
          unique = set(hashes.values())
          assert len(unique) == 1, f"archive hashes differ across runners: {hashes}"
          print("matching_sha256=" + unique.pop())
          EOF
