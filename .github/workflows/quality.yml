name: Repository quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-source:
    name: Codex source security coverage (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install locked test environment
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
      - name: Exercise actual Windows source guards
        run: python -m pytest -q tests/test_codex_plugin.py --junitxml=windows-source.xml --cov=scripts --cov-report=
      - name: Export Windows builder coverage
        run: python -m coverage xml --include="*/scripts/build_codex_plugin.py" -o coverage-codex-windows.xml
      - name: Require complete execution and normalize coverage paths
        shell: python
        run: |
          import xml.etree.ElementTree as E
          suites = E.parse('windows-source.xml').findall('.//testsuite')
          assert sum(int(s.get('tests', 0)) for s in suites) >= 15
          assert sum(int(s.get('skipped', 0)) for s in suites) == 0
          assert sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites) == 0
          report = E.parse('coverage-codex-windows.xml')
          sources = report.find('sources')
          sources.clear()
          E.SubElement(sources, 'source').text = '.'
          classes = report.findall('.//class')
          assert len(classes) == 1
          assert classes[0].get('filename').endswith('build_codex_plugin.py')
          classes[0].set('filename', 'scripts/build_codex_plugin.py')
          report.write('coverage-codex-windows.xml', encoding='utf-8')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-windows-coverage
          path: |
            coverage-codex-windows.xml
            windows-source.xml
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud quality gate
    needs: windows-source
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    # Checkout, analysis and the 300 s quality-gate wait share this budget.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require native source coverage
        env:
          WINDOWS_SOURCE_RESULT: ${{ needs.windows-source.result }}
        run: test "$WINDOWS_SOURCE_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo '::error::Configure the SONAR_TOKEN repository secret.'; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          # The lcov test reporter needs a Node with built-in coverage reporting.
          node-version: '22'
      - name: Measure coverage for the quality gate
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-sonar-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
          # The distribution contract tests read the built artifacts, so build
          # them first, exactly as the distribution job does.
          python -m build
          python -m pytest -q tests --cov --cov-report=xml
      - name: Measure JavaScript coverage for the managed and Pi harnesses
        run: |
          mkdir -p coverage
          # The Pi host test imports the real SDK from this locked tree.
          npm ci --prefix integrations/agent-hosts --ignore-scripts --no-audit --no-fund
          node --test --experimental-test-coverage \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            tests/test_managed_launcher.mjs tests/test_managed_bootstrap.mjs \
            tests/test_pi_owner_extension.mjs tests/test_pi_owner_host.mjs \
            tests/test_pi_owner_transport.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: codex-windows-coverage
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scanner host lives in the workflow, not in a data file, so a
          # pull request cannot redirect the token by editing a properties file.
          SONAR_HOST_URL: https://sonarcloud.io

  lint:
    # The job name is a required branch check. Keep it stable.
    name: Python and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The secret scan walks the commits that the event introduced.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: "python -m pip install --only-binary=:all: 'ruff==0.15.1'"
      - name: Lint release scripts and acceptance tests
        run: ruff check scripts tests integrations/workbuddy
      - name: Require matching immutable CodeQL action pins
        run: >-
          python -c "import re; from pathlib import Path;
          pins=re.findall(r'uses: github/codeql-action/(?:init|analyze)@([0-9a-f]{40})', Path('.github/workflows/codeql.yml').read_text());
          assert len(pins)==2 and len(set(pins))==1, 'CodeQL init/analyze pins must match'"
      - name: Install verified actionlint 1.7.12
        env:
          ACTIONLINT_ARCHIVE: ${{ runner.temp }}/actionlint.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$ACTIONLINT_ARCHIVE" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax, expressions and shell steps
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Audit workflow security with zizmor 1.32.0
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false
          version: 1.32.0
          persona: regular
      - name: Install verified gitleaks 8.30.1
        env:
          GITLEAKS_ARCHIVE: ${{ runner.temp }}/gitleaks.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$GITLEAKS_ARCHIVE" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $GITLEAKS_ARCHIVE" | sha256sum --check
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the commits introduced by this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          base="${BASE_SHA:-}"
          case "$base" in
            "" | 0000000000000000000000000000000000000000) base="" ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi
          if [ -z "$base" ] && git rev-parse --verify --quiet origin/main >/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [ -n "$base" ] && [ "$base" != "$HEAD_SHA" ]; then
            scan_range="$base..$HEAD_SHA"
          else
            # No usable base: every commit reachable from the tip is new here.
            scan_range="$HEAD_SHA"
          fi
          # A merge commit has no patch by default, so a secret added while
          # resolving a conflict would pass. `remerge` reports only the
          # conflict resolution, never content merged in from another branch.
          scan_range="$scan_range --diff-merges=remerge"
          echo "Scanning $scan_range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$scan_range" .
