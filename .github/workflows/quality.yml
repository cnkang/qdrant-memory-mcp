name: Repository quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sonarcloud:
    name: SonarCloud quality gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo '::error::Configure the SONAR_TOKEN repository secret.'; exit 1; }
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scanner host lives in the workflow, not in a data file, so a
          # pull request cannot redirect the token by editing a properties file.
          SONAR_HOST_URL: https://sonarcloud.io

  lint:
    name: Python and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: "python -m pip install --only-binary=:all: 'ruff==0.15.1'"
      - name: Lint release scripts and acceptance tests
        run: ruff check scripts tests integrations/workbuddy
      - name: Require matching immutable CodeQL action pins
        run: >-
          python -c "import re; from pathlib import Path;
          pins=re.findall(r'uses: github/codeql-action/(?:init|analyze)@([0-9a-f]{40})', Path('.github/workflows/codeql.yml').read_text());
          assert len(pins)==2 and len(set(pins))==1, 'CodeQL init/analyze pins must match'"
      - name: Install verified actionlint 1.7.12
        env:
          ACTIONLINT_ARCHIVE: ${{ runner.temp }}/actionlint.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$ACTIONLINT_ARCHIVE" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax, expressions and shell steps
        run: '"$RUNNER_TEMP/actionlint" -color'
