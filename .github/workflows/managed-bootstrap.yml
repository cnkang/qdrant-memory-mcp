name: Managed Python prerequisite

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Managed Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - name: Require artifact and archive safety tests
        run: node --test tests/test_managed_bootstrap.mjs
      - name: Require native Apple Silicon for macOS acceptance
        if: runner.os == 'macOS'
        run: node --eval "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw new Error('macOS acceptance requires native arm64 Node.js');"
      - name: Prepare a fresh managed Python with no system tools on PATH
        run: node integrations/managed/bootstrap.mjs --probe
