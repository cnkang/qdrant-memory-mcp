name: WorkBuddy connector preview
on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbuddy-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connector:
    name: WorkBuddy package and stdio acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/skills
          ref: 691313f2b05a23742dc7eaa06cc98dc26d7e5fd5
          path: .workbuddy-skill
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install . 'pytest>=8,<10' 'requests>=2,<3' 'PyYAML==6.0.3' 'uv==0.9.26'
      - run: python integrations/workbuddy/build.py --check
      - run: python integrations/workbuddy/build.py
      - name: Package, release guards and candidate stdio acceptance
        run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_release.py tests/test_workbuddy_public_install.py tests/test_workbuddy_mcp.py
      - name: Check exact public MCP version availability
        id: public
        run: python integrations/workbuddy/public_install.py
      - name: Require public uvx acceptance for published versions
        if: steps.public.outputs.exists == 'true'
        env:
          WORKBUDDY_TEST_UVX: '1'
        run: python -m pytest -q tests/test_workbuddy_mcp.py
      - name: Verify checksum
        working-directory: dist/workbuddy
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workbuddy-connector-preview
          path: dist/workbuddy/*
          retention-days: 14
          if-no-files-found: error
