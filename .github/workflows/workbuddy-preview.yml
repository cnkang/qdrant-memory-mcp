name: WorkBuddy connector preview
on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python interpreter for the optional manual probe; required checks stay on 3.11
        required: false
        default: '3.11'
        type: choice
        options: ['3.11', '3.14']
      node_version:
        description: Node.js interpreter for the optional manual probe; required checks stay on Node 20
        required: false
        default: '20'
        type: choice
        options: ['20', '22', '24']
permissions:
  contents: read
concurrency:
  group: workbuddy-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  connector:
    name: WorkBuddy package and stdio acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: cc592289f126c786fd6c11038fcaa966c6de2b40
          path: .workbuddy-skill
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '20'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workbuddy-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
      - run: python integrations/workbuddy/build.py --check
      - run: python integrations/workbuddy/build.py
      - name: Package, release guards and candidate stdio acceptance
        run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_workflow_inputs.py tests/test_workbuddy_release.py tests/test_workbuddy_public_install.py tests/test_workbuddy_mcp.py tests/test_dsh_bundle.py
      - name: Check exact public MCP and launcher pins
        id: public
        run: python integrations/workbuddy/public_install.py
      - name: Require public uvx acceptance for published versions
        if: steps.public.outputs.exists == 'true'
        env:
          WORKBUDDY_TEST_UVX: '1'
        run: python -m pytest -q tests/test_workbuddy_mcp.py
      - name: Handshake through the exact public npm launcher pin
        if: steps.public.outputs.launcher == 'true'
        env:
          QDRANT_MEMORY_MANAGED_ROOT: ${{ runner.temp }}/qdrant-preview-handshake
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: node tests/public-launcher-acceptance.mjs --handshake-only
      - name: Verify checksum
        working-directory: dist/workbuddy
        run: sha256sum --check ./*.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workbuddy-connector-preview
          path: dist/workbuddy/*
          retention-days: 14
          if-no-files-found: error
  compatibility:
    name: WorkBuddy compatibility probe
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.python_version != '3.11' || inputs.node_version != '20') }}
    needs: connector
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WORKBUDDY_TEST_PYTHON_VERSION: ${{ inputs.python_version || '3.11' }}
      WORKBUDDY_TEST_NODE_VERSION: ${{ inputs.node_version || '20' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: cc592289f126c786fd6c11038fcaa966c6de2b40
          path: .workbuddy-skill
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ env.WORKBUDDY_TEST_PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.WORKBUDDY_TEST_NODE_VERSION }}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-workbuddy-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
      - run: python integrations/workbuddy/build.py --check
      - run: python integrations/workbuddy/build.py
      - name: Package, release guards and candidate stdio compatibility
        run: python -m pytest -q tests/test_workbuddy_package.py tests/test_workbuddy_workflow_inputs.py tests/test_workbuddy_release.py tests/test_workbuddy_public_install.py tests/test_workbuddy_mcp.py tests/test_dsh_bundle.py
      - name: Check exact public MCP and launcher pins
        id: public
        run: python integrations/workbuddy/public_install.py
      - name: Require public uvx compatibility for published versions
        if: steps.public.outputs.exists == 'true'
        env:
          WORKBUDDY_TEST_UVX: '1'
        run: python -m pytest -q tests/test_workbuddy_mcp.py
      - name: Handshake through the exact public npm launcher pin
        if: steps.public.outputs.launcher == 'true'
        env:
          QDRANT_MEMORY_MANAGED_ROOT: ${{ runner.temp }}/qdrant-compatibility-handshake
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-compatibility-cache
        run: node tests/public-launcher-acceptance.mjs --handshake-only
      - name: Verify checksum
        working-directory: dist/workbuddy
        run: sha256sum --check ./*.sha256
