name: DSH next compatibility

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/dsh-next.yml'
      - 'integrations/dsh/**'
      - 'tests/dsh*'
      - 'tests/test_dsh_bundle.py'
  pull_request:
    paths:
      - '.github/workflows/dsh-next.yml'
      - 'integrations/dsh/**'
      - 'tests/dsh*'
      - 'tests/test_dsh_bundle.py'

permissions:
  contents: read

concurrency:
  group: dsh-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next:
    name: Official DSH next (compatibility probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/skills
          ref: c2d755cd6df3f9af069d9faff10fbcfa5b29806e
          path: .scratch/canonical-skills
          persist-credentials: false
      - name: Install Python MCP and test dependencies
        run: python -m pip install . 'pytest>=8,<10' 'requests>=2,<3' 'jsonschema>=4,<5'
      - name: Resolve official next packages independently of the release lockfile
        working-directory: integrations/dsh
        run: >-
          npm install --save-exact --ignore-scripts --no-audit --no-fund
          @deepseek-ai/dsh@next
          @deepseek-ai/dsh-mcp-client@next
          @deepseek-ai/dsh-skill-filesystem@next
      - name: Capture resolved dependency tree
        working-directory: integrations/dsh
        run: npm ls --all --json > next-dependency-tree.json
      - name: Capture npm advisory report
        working-directory: integrations/dsh
        shell: bash
        run: |
          set +e
          npm audit --json > next-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("next-audit.json", "utf8")); if (!report.metadata || report.error) process.exit(1);'
      - name: Reject the known vulnerable MCP SDK baseline
        run: python -m pytest -q tests/test_dsh_bundle.py::test_dsh_lock_excludes_oauth_vulnerable_sdk_versions
      - name: Ensure pnpm for the official DSH plugin manager
        shell: bash
        run: pnpm --version || npm install --global pnpm
      - name: Real official client, CLI, Skill provider and Bundle acceptance
        env:
          DSH_TEST_MODULES: ${{ github.workspace }}/integrations/dsh/node_modules
          QDRANT_TEST_SKILL_ROOT: ${{ github.workspace }}/.scratch/canonical-skills
        run: python -m pytest -q tests/dsh_acceptance.py --junitxml=dsh-next-results.xml
      - name: Reject skipped or incomplete acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=E.parse('dsh-next-results.xml').findall('.//testsuite');
          assert sum(int(s.get('tests',0)) for s in suites)>=3;
          assert sum(int(s.get('skipped',0)) for s in suites)==0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dsh-next-evidence
          path: |
            dsh-next-results.xml
            integrations/dsh/package-lock.json
            integrations/dsh/next-dependency-tree.json
            integrations/dsh/next-audit.json
          if-no-files-found: error
