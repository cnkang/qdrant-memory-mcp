name: DSH next compatibility

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: DSH host version (next, latest, or an exact published semver)
        required: false
        default: next
        type: string
      dsh_mcp_client_version:
        description: DSH MCP client version (next, latest, or an exact published semver)
        required: false
        default: next
        type: string
      dsh_skill_filesystem_version:
        description: DSH skill filesystem version (next, latest, or an exact published semver)
        required: false
        default: next
        type: string
      node_version:
        description: Node.js compatibility version
        required: false
        default: '24'
        type: string
      python_version:
        description: Python compatibility version
        required: false
        default: '3.11'
        type: string
      pnpm_version:
        description: Exact pnpm version (11 or newer); defaults to 12.14.0
        required: false
        default: '12.14.0'
        type: string
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/dsh-next.yml'
      - 'integrations/dsh/**'
      - 'tests/dsh*'
      - 'tests/test_dsh_bundle.py'
      - 'tests/dev/test_dsh_lock_audit.py'
  pull_request:
    paths:
      - '.github/workflows/dsh-next.yml'
      - 'integrations/dsh/**'
      - 'tests/dsh*'
      - 'tests/test_dsh_bundle.py'
      - 'tests/dev/test_dsh_lock_audit.py'

permissions:
  contents: read

concurrency:
  group: dsh-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next:
    name: Official DSH next (compatibility probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ github.event.inputs.node_version || '24' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ github.event.inputs.python_version || '3.11' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/skills
          ref: 5bac228e8594a6cf8ff642c22f0f0e100ebca3a6
          path: .scratch/canonical-skills
          persist-credentials: false
      - name: Install Python MCP and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-mcp-ci.txt
          python -m pip install --only-binary=:all: --no-deps .
      # Resolve the selected DSH host and floating companion dist-tags once into
      # the runner's lock file, then install exactly that resolution. Nothing is
      # committed or pushed.
      - name: Resolve the selected official DSH packages into the runner lock
        env:
          DSH_VERSION: ${{ github.event.inputs.dsh_version || 'next' }}
          DSH_MCP_CLIENT_VERSION: ${{ github.event.inputs.dsh_mcp_client_version || 'next' }}
          DSH_SKILL_FILESYSTEM_VERSION: ${{ github.event.inputs.dsh_skill_filesystem_version || 'next' }}
        working-directory: integrations/dsh
        shell: bash
        run: |
          for version in "$DSH_VERSION" "$DSH_MCP_CLIENT_VERSION" "$DSH_SKILL_FILESYSTEM_VERSION"; do
            case "$version" in
              next|latest) ;;
              *)
                if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
                  echo "::error::DSH package versions must be next, latest, or exact published semver values"
                  exit 1
                fi
                ;;
            esac
          done
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund \
            "@deepseek-ai/dsh@${DSH_VERSION}" \
            "@deepseek-ai/dsh-mcp-client@${DSH_MCP_CLIENT_VERSION}" \
            "@deepseek-ai/dsh-skill-filesystem@${DSH_SKILL_FILESYSTEM_VERSION}"
      - name: Install the exact next resolution from the lock
        working-directory: integrations/dsh
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture resolved dependency tree
        working-directory: integrations/dsh
        run: npm ls --all --json > next-dependency-tree.json
      - name: Capture npm advisory report
        working-directory: integrations/dsh
        shell: bash
        run: |
          set +e
          npm audit --json > next-audit.json
          audit_status=$?
          set -e
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("next-audit.json", "utf8")); if (!report.metadata || report.error) process.exit(1); const counts = report.metadata.vulnerabilities || {}; console.log("advisories:", JSON.stringify(counts)); if (counts.high || counts.critical) process.exit(1);'
      - name: Reject known vulnerable SDK, HTTP client, schema and ZIP parser versions
        run: >-
          python -m pytest -q
          tests/dev/test_dsh_lock_audit.py::test_dsh_lock_excludes_oauth_vulnerable_sdk_versions
          tests/dev/test_dsh_lock_audit.py::test_dsh_lock_excludes_vulnerable_http_and_schema_versions
          tests/dev/test_dsh_lock_audit.py::test_dsh_lock_excludes_vulnerable_zip_parser_versions
      - name: Validate exact supported pnpm version
        env:
          PNPM_VERSION: ${{ github.event.inputs.pnpm_version || '12.14.0' }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          version = os.environ["PNPM_VERSION"]
          match = re.fullmatch(
              r"(?P<major>0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)"
              r"(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?",
              version,
          )
          if match is None:
              raise SystemExit("pnpm_version must be an exact published semver")
          if int(match.group("major")) < 11:
              raise SystemExit("pnpm/setup v3 requires pnpm >=11")
          PY
      - name: Set up pnpm for the official DSH plugin manager
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          version: ${{ github.event.inputs.pnpm_version || '12.14.0' }}
          install: false
      - name: Real official client, CLI, Skill provider and Bundle acceptance
        env:
          DSH_TEST_MODULES: ${{ github.workspace }}/integrations/dsh/node_modules
          DSH_EXPECT_INCOMPATIBLE_BUNDLE: '1'
          QDRANT_TEST_SKILL_ROOT: ${{ github.workspace }}/.scratch/canonical-skills
        run: python -m pytest -q tests/dsh_acceptance.py --junitxml=dsh-next-results.xml
      - name: Reject skipped or incomplete acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=E.parse('dsh-next-results.xml').findall('.//testsuite');
          assert sum(int(s.get('tests',0)) for s in suites)>=3;
          assert sum(int(s.get('skipped',0)) for s in suites)==0"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dsh-next-evidence
          path: |
            dsh-next-results.xml
            integrations/dsh/package-lock.json
            integrations/dsh/next-dependency-tree.json
            integrations/dsh/next-audit.json
          if-no-files-found: error
