[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "qdrant-memory-mcp"
version = "0.3.0"
description = "Metadata-only stdio MCP distribution of the Qdrant Memory Runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["hermes-plugin-qdrant-memory[mcp]==0.6.0"]
keywords = ["mcp", "memory", "qdrant", "agents"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "requests>=2,<3", "PyYAML>=6,<7", "mcp>=1.30,<3", "jsonschema>=4,<5", "build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
qdrant-memory-mcp = "qdrant_memory.standalone:main"

[project.urls]
Homepage = "https://github.com/cnkang/qdrant-memory-mcp"
Repository = "https://github.com/cnkang/qdrant-memory-mcp"
Issues = "https://github.com/cnkang/qdrant-memory-mcp/issues"
Changelog = "https://github.com/cnkang/qdrant-memory-mcp/blob/main/CHANGELOG.md"
Runtime = "https://github.com/cnkang/hermes-plugin-qdrant-memory"
Skill = "https://github.com/cnkang/skills/tree/main/qdrant-memory"

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Sonar only scans .github, integrations and scripts, so measure exactly the
# Python that lands in that analysis; anything else would be ignored.
source = ["integrations/workbuddy", "scripts"]
branch = false

[tool.coverage.report]
skip_covered = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
