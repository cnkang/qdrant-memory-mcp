# Qdrant Memory Bundle: connect a prepared shared-memory profile through the
# official DSH MCP client. Prepare the backend before enabling this bundle:
#   npx -y @cnkang/qdrant-memory-launcher@0.1.0-rc.3 prepare dsh
# The probe never runs installation or model downloads.
- insert:
    - id: cnkang-qdrant-memory-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: qdrant-memory
        transport: stdio
        command: npx
        args:
          - -y
          - '@cnkang/qdrant-memory-launcher@0.1.0-rc.3'
          - mcp
          - dsh
