# One Host entry owns the MCP namespace and selects one explicit storage mode.
- insert:
    - id: cnkang-qdrant-memory-mcp
      name: '@cnkang/qdrant-memory-dsh-bundle'
      config:
        mode: legacy
        auto_recall:
          enabled: false
        auto_capture:
          enabled: false
        memory_injection:
          enabled: false
