# Enable for this launch only: dsh web --patch /absolute/path/to/this-file
# Prepare this dedicated profile first; no setup/download occurs during probing.
# This source preview uses public MCP 0.3.3 and Runtime 0.6.2. The DSH overlay
# itself remains an opt-in candidate; its full Cloud/Desktop acceptance is
# still incomplete. Verify the package pin on PyPI:
# https://pypi.org/project/qdrant-memory-mcp/0.3.3/
# Until the DSH lifecycle overlay passes full acceptance, follow the published
# 0.3.3 DSH guide:
# https://github.com/cnkang/qdrant-memory-mcp/blob/main/docs/dsh-integration.md
- insert:
    - id: cnkang-qdrant-memory-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: qdrant-memory
        transport: stdio
        command: uvx
        args:
          - --from
          - qdrant-memory-mcp==0.3.3
          - qdrant-memory-mcp
          - --home
          - !!js process.env.QDRANT_MEMORY_DSH_PROFILE || require('node:path').join(require('node:os').homedir(), '.qdrant-memory-dsh')
          - mcp
        env:
          QDRANT_API_KEY: !!js process.env.QDRANT_API_KEY || ''
          EMBEDDING_API_KEY: !!js process.env.EMBEDDING_API_KEY || ''
